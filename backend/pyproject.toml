[project]
name = "backend"
version = "0.1.0"
description = "printy backend: HTTP API + SQLite + ESC/POS thermal printer"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "fastmcp>=3.2.4",
    "python-escpos>=3.1",
    "pyusb>=1.3.1",
    "uvicorn[standard]>=0.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.wheel.force-include]
"backend/prompts" = "backend/prompts"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[project.scripts]
backend = "backend.__main__:main"
